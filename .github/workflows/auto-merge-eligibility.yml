name: Auto-merge Eligibility

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI, PR Risk Classifier, Risk Gate]
    types: [completed]

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    name: Report only (never merges)
    runs-on: ${{ (startsWith(vars.CI_RUNNER_SMALL, 'blacksmith-') && vars.CI_RUNNER_SMALL) || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - name: Update sticky eligibility report
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            let pull = context.payload.pull_request;
            if (!pull) {
              const summary = context.payload.workflow_run.pull_requests?.[0];
              if (!summary) {
                core.notice('No pull request is associated with this workflow run');
                return;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: summary.number,
              });
              pull = response.data;
            }

            const labels = pull.labels.map((label) => label.name);
            const risk =
              ['low', 'medium', 'high'].find((value) =>
                labels.includes(`risk:${value}`),
              ) ?? 'unclassified';
            const requiredChecks = [
              'Vite+ monorepo check',
              'Classify path risk',
              'Current-head approval policy',
            ];
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pull.head.sha,
                per_page: 100,
              },
              (response) => response.data.check_runs,
            );
            const checkRows = requiredChecks.map((name) => {
              const matches = checkRuns.filter((run) => run.name === name);
              const run = matches.sort(
                (left, right) =>
                  new Date(right.started_at ?? 0) -
                  new Date(left.started_at ?? 0),
              )[0];
              const green =
                run?.status === 'completed' &&
                ['success', 'neutral', 'skipped'].includes(run.conclusion);
              return {
                name,
                state: green
                  ? 'green'
                  : run?.status === 'completed'
                    ? run.conclusion
                    : run?.status ?? 'not reported',
                green,
              };
            });
            const checksGreen = checkRows.every((row) => row.green);
            const eligible = risk === 'low' && checksGreen;

            const pathway =
              risk === 'low'
                ? 'Agent auto-merge may be used only after every required check is green.'
                : risk === 'medium'
                  ? 'Human review is required; agent auto-merge is prohibited.'
                  : risk === 'high'
                    ? 'Current-head human write approval is required; agent auto-merge is prohibited.'
                    : 'Wait for the authoritative path classifier.';
            const marker = '<!-- terminal49-auto-merge-eligibility -->';
            const body = `${marker}
            ### Auto-merge eligibility (report only)

            **${eligible ? 'Eligible by policy' : 'Not currently eligible'}** — path label: \`risk:${risk}\`

            ${pathway}

            | Required check | Current state |
            | --- | --- |
            ${checkRows.map((row) => `| ${row.name} | ${row.state} |`).join('\n')}

            This reporter never approves, enables auto-merge, or calls a merge API. Repository administrators must first require CI (which runs \`agent-verify\` once available), PR Risk Classifier, and Risk Gate on \`main\`.`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                per_page: 100,
              },
            );
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body,
              });
            }
            core.notice(
              eligible
                ? 'Policy reports this PR as eligible; no merge action was taken'
                : `Not eligible: risk:${risk}, required checks green=${checksGreen}`,
            );

      - name: Keep the reporter non-blocking
        if: always()
        run: echo "Eligibility reporting never blocks or merges."
