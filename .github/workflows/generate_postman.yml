name: Generate Postman Collection

on:
  push:
    branches: [main]
    paths:
      - 'docs/openapi.json'
      - 'package-lock.json'
      - '.github/workflows/generate_postman.yml'
      - 'tools/generate-postman.mjs'
      - 'tools/postman-generation.test.mjs'
  pull_request:
    paths:
      - 'package-lock.json'
      - '.github/workflows/generate_postman.yml'
      - 'tools/generate-postman.mjs'
      - 'tools/postman-generation.test.mjs'

permissions:
  contents: read

jobs:
  validate-postman-collection:
    runs-on: ${{ (startsWith(vars.CI_RUNNER_SMALL, 'blacksmith-') && vars.CI_RUNNER_SMALL) || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: node tools/generate-postman.mjs
      - run: node --test tools/postman-generation.test.mjs

  publish-postman-collection:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-postman-collection
    runs-on: ${{ (startsWith(vars.CI_RUNNER_SMALL, 'blacksmith-') && vars.CI_RUNNER_SMALL) || 'blacksmith-2vcpu-ubuntu-2404' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - run: node tools/generate-postman.mjs
      - run: node --test tools/postman-generation.test.mjs
      - name: Commit collection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Terminal49-API.postman_collection.json
          if ! git diff --quiet --cached; then
            git commit -m "chore: regenerate Postman collection"
            git push origin HEAD:main
          fi
