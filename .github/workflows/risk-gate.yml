name: Risk Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: risk-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    name: Current-head approval policy
    runs-on: ${{ (startsWith(vars.CI_RUNNER_SMALL, 'blacksmith-') && vars.CI_RUNNER_SMALL) || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - name: Enforce high-risk approval
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const labels = pull.labels.map((label) => label.name);
            const riskLabels = labels.filter((label) =>
              /^risk:(low|medium|high)$/.test(label),
            );

            if (riskLabels.length !== 1) {
              core.setFailed(
                `Expected exactly one path risk label; found ${riskLabels.length}. Wait for PR Risk Classifier.`,
              );
              return;
            }
            if (riskLabels[0] !== 'risk:high') {
              core.notice(`${riskLabels[0]} does not require Risk Gate approval`);
              return;
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                per_page: 100,
              },
            );
            const latestByReviewer = new Map();
            for (const review of reviews) {
              if (
                review.commit_id !== pull.head.sha ||
                review.user?.type !== 'User'
              ) {
                continue;
              }
              latestByReviewer.set(review.user.login, review);
            }

            const approvedWriters = [];
            for (const [login, review] of latestByReviewer) {
              if (review.state !== 'APPROVED') continue;
              try {
                const { data } =
                  await github.rest.repos.getCollaboratorPermissionLevel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: login,
                  });
                if (['admin', 'maintain', 'write'].includes(data.permission)) {
                  approvedWriters.push(login);
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (approvedWriters.length === 0) {
              core.setFailed(
                `risk:high requires an approval from a human with write access on current head ${pull.head.sha.slice(0, 7)}`,
              );
              return;
            }
            core.notice(
              `Current-head write approval: ${approvedWriters.join(', ')}`,
            );
